- id: F05
  name: volatility_compression_expansion
  mechanism: >
    Volatility clustering is the single most robust empirical regularity in finance:
    low-volatility periods are followed by expansion with high probability. This forecasts
    MAGNITUDE, not direction, so there is no counterparty story for the directional half —
    the trigger is a coin flip and any edge must come from payoff asymmetry rather than hit
    rate. What is new here is session structure: compression into the cash open or into a
    scheduled release is a mechanically different setup from compression at a random hour,
    which is a distinction crypto's 24/7 tape could not express.
  condition: >
    If realized_vol(1h) is below the p20 of the trailing 20 sessions AT THE SAME CLOCK TIME,
    arm the setup; on the first close beyond k*sigma from the compression midpoint, enter
    that direction and exit at H or 16:55 ET, whichever comes first.
    vol_pct in {15, 20, 25}, k in {1.5, 2, 2.5}, H in {1, 2, 3} h.
  horizon_minutes: [60, 120, 180]
  registered: 2026-08-28
  # ---- BREAK DEADLINE, DERIVED FROM THE MECHANISM 2026-09-02, BEFORE ANY RUN ----
  #
  # The registered condition said to enter "on the first close beyond k*sigma" and never
  # said BY WHEN. Unbounded within the session it fired on 94% of armings, which made the
  # compression filter nearly decorative and turned the test into "does price eventually
  # move after a quiet hour" - trivially true, and not a hypothesis.
  #
  # THE DERIVATION. The mechanism is volatility clustering: a quiet period forecasts
  # NEAR-TERM expansion. A realized-volatility estimate is informative over a horizon on the
  # order of its own estimation window - that is what the decay of the autocorrelation in
  # |returns| means - so a vol measured over ONE HOUR speaks to the next hour, not the next
  # six. A second and independent argument lands on the same number: the trigger measures
  # distance from the COMPRESSION MIDPOINT, and hours later that midpoint no longer
  # describes the current price level, so the reference the condition rests on has gone
  # stale. Hence ONE COMPRESSION WINDOW: 60 minutes from the end of the armed hour.
  #
  # IT IS ONE VALUE, NOT A NEW GRID AXIS. Sweeping {30, 60, 90} would convert a
  # specification repair into a tuning opportunity, which is the thing being repaired.
  #
  # ---- AND IT DOES NOT FIX THE VACUITY. THERE IS A SECOND, INDEPENDENT DEFECT. ----
  #
  # Re-measured with the deadline applied, F05 still fires on 79-91% of armings:
  #
  #     k=1.5  ~90%      k=2.0  ~86%      k=2.5  ~80%      (both instruments)
  #
  # THE CAUSE IS THAT sigma IS MEASURED ON THE COMPRESSED WINDOW ITSELF. Compression
  # SELECTS hours with small sigma by construction, so k*sigma is a small distance, and
  # price almost always travels that far within the next hour. The tighter the compression,
  # the easier the trigger. The filter selects for exactly the condition that makes the
  # trigger nearly certain - the specification is self-defeating, and no deadline can
  # repair that.
  #
  # THE OPEN DECISION, WHICH IS NOT MINE TO MAKE. What should k*sigma be measured against?
  #   (a) the compressed hour's own sigma - the current reading, self-defeating
  #   (b) the trailing 20-session sigma AT THE SAME CLOCK TIME - the same quantity the p20
  #       filter already compares against, so a break would mean "price moved a NORMAL-sized
  #       amount", which is what an expansion claim actually asserts
  #   (c) a daily ATR-scaled distance
  # (b) is the reading most consistent with the rest of the condition, but choosing it is a
  # change to the registered hypothesis and must be a deliberate decision rather than a
  # repair made mid-audit.
  #
  # F05 IS NOT SCHEDULABLE until that decision is recorded. Its routes are open on event
  # count - and that is exactly the trap: a vacuous condition with plenty of events will
  # produce a confident-looking result about nothing.
  # ---- RETIRED 2026-09-02 ON AN INFORMATIVE NULL ----
  # reports/f05_stage1.md. 54 cells, 54 trials, run under the CORRECTED condition.
  #
  # THIS IS THE FIRST RETIREMENT IN THE CATALOG WHERE THE SAMPLE WAS DEMONSTRABLY THERE.
  # 45 of 54 cells sit above the swept range, on 11,000-18,600 events each. The null is a
  # statement about the market rather than about the test.
  #
  #   1 nominal separation against 1.35 expected by chance
  #   0 BH survivors at FDR 0.05, on either instrument
  #   best informative cell +0.79 bps = 0.05x its detection floor (MNQ p15 k=2.5 H=180,
  #     5,812 events, p=0.2137)
  #   aggregates negative net of cost on both: -0.88 bps MGC, -0.44 MNQ
  #
  # The single nominal separation is on MGC and does not survive BH. Nothing comes within
  # a factor of twenty of the floor.
  #
  # MNQ CARRIES THE STRONGER NULL, at 83.16% coverage against MGC's 64.16%. BOTH
  # INSTRUMENTS POINT THE SAME WAY, which is the easy case: the standing MGC caveat -
  # forward-filling thins measured volatility and biases toward APPARENT significance -
  # would have mattered had MGC separated and MNQ not. It did not arise. F05's mechanism
  # is generic to speculative price series and holds in both instruments, so neither is a
  # control for the other and neither is the wrong instrument for the claim.
  #
  # MNQ AT 60 MINUTES IS EXCLUDED FROM THE VERDICT as uninformative: 6,965 measured events
  # against the 19,722 at which a floor resolves. Its nine cells are reported for
  # completeness only.
  #
  # NO REAL-DATA CONTROL EXISTS AT THIS EVENT REGIME. F14 validated the harness at
  # ~48,000-52,000 events; F05's cells hold 6,965-18,591, and no control can be built
  # between those regimes on this data. This null therefore carries the section 7.2
  # synthetic GARCH assurance - the harness does not promote idealised noise - and NOTHING
  # from F14. That limit is part of the verdict, not a footnote to it.
  #
  # ---- THE SPECIFICATION CORRECTION IS WHAT MADE THE NULL MEANINGFUL ----
  #
  # AS REGISTERED, THE CONDITION TESTED NOTHING. k*sigma was measured against the
  # COMPRESSED WINDOW'S OWN sigma, so compression shrank the trigger distance exactly when
  # the filter fired. It broke on 79-91% of armings even after the mechanism-derived
  # 60-minute deadline was applied, and the k axis moved the break rate by ten points
  # across its entire range. A null from that condition would have been a statement about
  # a trigger that fires almost always - which is to say, about nothing.
  #
  # The correction (decisions.md section 27) referenced the trigger to NORMAL volatility -
  # the median of the trailing 20 sessions' sigma at the same clock hour, the quantity the
  # p20 arming filter already used - because expansion means volatility RETURNING TOWARD
  # NORMAL. Break rates fell to 44-78% and k discriminated for the first time.
  #
  # THE CORRECTION DID NOT PRODUCE A POSITIVE RESULT. It produced a null that means
  # something. Both repairs - the deadline and the sigma reference - were derived from the
  # mechanism and recorded BEFORE the run, which is what separates a correction from a
  # tuning choice made after seeing a result.
  #
  # All 54 cells stay in N.
  status: retired
  retired: 2026-09-02
  retired_reason: >
    INFORMATIVE NULL - the first retirement here where the sample was
    demonstrably adequate. 45 informative cells across 11,000-18,600
    events, 1 nominal separation against 1.35 expected, no BH survivors
    on either instrument, and the best informative cell at 0.05x its
    detection floor. Aggregates negative net of cost on both. MNQ
    carries the stronger null at 83.16% coverage against MGC's 64.16%,
    and BOTH INSTRUMENTS POINT THE SAME WAY, so the standing MGC caveat
    never had to be adjudicated. NO REAL-DATA CONTROL EXISTS AT THIS
    EVENT REGIME: F14 validated the harness at ~48,000-52,000 events
    and none can be built between that and F05's 6,965-18,591, so this
    null carries the section 7.2 synthetic assurance and nothing from
    F14. THE SPECIFICATION CORRECTION IS WHAT MADE THE NULL MEANINGFUL:
    as registered the trigger referenced the compressed window's own
    sigma, so it fired on 79-91% of armings and tested nothing. Both
    repairs were derived from the mechanism and recorded before the run.
  # ---- SPECIFICATION CORRECTION ADOPTED 2026-09-02 (decisions.md section 27) ----
  #
  # THE REGISTERED VERSION DID NOT TEST ITS OWN MECHANISM. k*sigma was measured against the
  # COMPRESSED WINDOW'S OWN sigma. Compression SELECTS hours with small sigma, so the
  # trigger distance shrank exactly when the filter fired, and F05 broke on 79-91% of
  # armings even after the mechanism-derived 60-minute deadline was applied. The tighter
  # the compression, the easier the trigger - the condition was self-defeating.
  #
  # THE CORRECTION FOLLOWS FROM THE MECHANISM, NOT FROM THE DATA. Compression forecasts
  # EXPANSION, and expansion means volatility RETURNING TOWARD NORMAL. A trigger that
  # asserts expansion must therefore reference NORMAL volatility for that clock hour, not
  # the compressed sample it selected on. Normal is the MEDIAN of the trailing 20 sessions'
  # sigma at the same clock time - the same window and the same quantity the p20 arming
  # filter already compares against, so the condition now uses ONE consistent notion of
  # "usual volatility at this hour" for both halves instead of two incompatible ones.
  #
  # This is a CORRECTION rather than a tuning choice, and the distinction is the whole
  # point: the registered version was not a weaker test of the mechanism, it was a test of
  # something else. It is one value, not a new grid axis.
  #
  # EFFECT ON THE FIRING RATE - the k axis now does work, which it previously did not:
  #
  #                       before (own sigma)      after (normal sigma)
