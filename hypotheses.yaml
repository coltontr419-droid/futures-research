  #     k = 2.0              ~86%                     57-64%
  #     k = 2.5              ~80%                     44-50%
  #
  # ROUTES REMAIN OPEN, 5 of 6 per-cell: MNQ 120m/180m and MGC 60m/120m/180m. MNQ 60m drops
  # to BELOW SWEPT RANGE at 6,965 measured events against 19,722. F05 is schedulable again.
  #
  # The 60-minute break deadline recorded above is unchanged and still derived.
  specification_correction: >
    The registered condition measured k*sigma against the compressed window's own sigma,
    which does not test the mechanism: compression selects for small sigma, so the trigger
    shrank whenever the filter fired and it broke on 79-91% of armings. Expansion means
    volatility returning toward NORMAL, so the trigger now references the median of the
    trailing 20 sessions' sigma at the same clock time - the quantity the p20 arming filter
